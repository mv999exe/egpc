<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Compressor</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <a class="back-link" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to Home
      </a>

      <header class="page-header">
        <h1>Image Compressor</h1>
        <p>Upload an image to shrink its size while keeping documents and invoices sharp and readable.</p>
      </header>

      <!-- Upload / drag & drop -->
      <div id="dropzone" class="dropzone">
        <div class="dz-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
        </div>
        <div class="dz-title">Drag &amp; drop an image here</div>
        <div class="dz-sub">or click to browse — JPG, PNG, WebP</div>
        <input id="file-input" type="file" accept="image/*" class="hidden" />
      </div>

      <!-- Loading status -->
      <div id="status" class="status hidden">
        <div class="spinner"></div>
        <div id="status-text">Compressing…</div>
      </div>

      <!-- Result -->
      <section id="result" class="result hidden">
        <div id="compare" class="compare">
          <img id="after-img" class="after-layer" alt="After (compressed)" />
          <div class="before-layer" id="before-layer">
            <img id="before-img" alt="Before (original)" />
          </div>
          <span class="label before">Before</span>
          <span class="label after">After</span>
          <div class="divider" id="divider">
            <div class="handle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
                <polyline points="9 18 3 12 9 6" transform="translate(12 0)" />
              </svg>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">Before</div>
            <div class="value" id="stat-before">—</div>
          </div>
          <div class="stat">
            <div class="label">After</div>
            <div class="value" id="stat-after">—</div>
          </div>
          <div class="stat">
            <div class="label">Saved</div>
            <div class="value" id="stat-saved">—</div>
          </div>
        </div>

        <p id="result-note" class="note hidden"></p>

        <div class="actions">
          <a id="download-btn" class="btn" download>Download AVIF</a>
          <button id="reset-btn" class="btn secondary" type="button">Compress another</button>
        </div>
      </section>
    </main>

    <script src="js/compressor.js"></script>
  </body>
</html>
